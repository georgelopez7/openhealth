name: openhealth authorization tests

model_file: ./openhealth.fga

tuples:
  # Professor Oak - he is a doctor
  - user: account:oak
    relation: account
    object: doctor:oak

  # Doctor Assignment - Professor Oak assigned to Ash
  - user: doctor:oak#account
    relation: doctor
    object: account:ash

  # Nurse Joy - she is a nurse
  - user: account:joy
    relation: account
    object: nurse:joy

  # Pokemon Center - it is a hospital - nurse joy is assigned
  - user: nurse:joy#account
    relation: nurse
    object: hospital:pokemon_center

  # Ash is assigned to Pokemon Center
  - user: hospital:pokemon_center
    relation: hospital
    object: account:ash

  # Ash's Medical Record
  - user: account:ash
    relation: owner
    object: medical_record:ash_annual_checkup

  # Misty's Medical Record
  - user: account:misty
    relation: owner
    object: medical_record:misty_water_exposure_assessment

  # Misty's Medical Record
  - user: account:misty
    relation: owner
    object: medical_record:misty_starmie_incident

tests:
  - name: account can VIEW but NOT EDIT own medical records
    check:
      - user: account:ash
        object: medical_record:ash_annual_checkup
        assertions:
          can_view: true
          can_edit: false
      - user: account:misty
        object: medical_record:misty_water_exposure_assessment
        assertions:
          can_view: true
          can_edit: false
      - user: account:misty
        object: medical_record:misty_starmie_incident
        assertions:
          can_view: true
          can_edit: false

  - name: doctor can VIEW and EDIT assigned patient's medical records
    check:
      - user: account:oak
        object: medical_record:ash_annual_checkup
        assertions:
          can_view: true
          can_edit: true

  - name: nurse at patient's hospital can VIEW but not EDIT
    check:
      - user: account:joy
        object: medical_record:ash_annual_checkup
        assertions:
          can_view: true
          can_edit: false

  - name: access denied - doctor not assigned to patient
    check:
      - user: account:oak
        object: medical_record:misty_water_exposure_assessment
        assertions:
          can_view: false
          can_edit: false

  - name: access denied - nurse not assigned to patient's hospital
    check:
      - user: account:joy
        object: medical_record:misty_water_exposure_assessment
        assertions:
          can_view: false
          can_edit: false

  - name: access denied - unrelated account
    check:
      - user: account:team_rocket
        object: medical_record:ash_annual_checkup
        assertions:
          can_view: false
          can_edit: false

  - name: access denied - other patients
    check:
      - user: account:misty
        object: medical_record:ash_annual_checkup
        assertions:
          can_view: false
          can_edit: false
          
      - user: account:ash
        object: medical_record:misty_water_exposure_assessment
        assertions:
          can_view: false
          can_edit: false
