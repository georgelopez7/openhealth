name: openhealth authorization tests

model_file: ./openhealth.fga

tuples:
  # Hospital Staff - Johto & Sinnoh Hospitals
  - user: user:nurse_joy
    relation: nurse
    object: hospital:johto

  - user: user:nurse_nancy
    relation: nurse
    object: hospital:sinnoh

  # Patient - Ash (Jhoto Hospital)
  - user: user:ash
    relation: _self
    object: patient:ash

  - user: user:gary
    relation: doctor
    object: patient:ash

  - user: hospital:johto
    relation: hospital
    object: patient:ash

  # Patient - Dawn (Sinnoh Hospital)
  - user: user:dawn
    relation: _self
    object: patient:dawn

  - user: user:barry
    relation: doctor
    object: patient:dawn

  - user: user:cynthia
    relation: guardian
    object: patient:dawn

  - user: hospital:sinnoh
    relation: hospital
    object: patient:dawn

  # Records
  - user: patient:ash
    relation: owner
    object: record:ash_blood_results

  - user: patient:dawn
    relation: owner
    object: record:dawn_vaccinations

tests:
  - name: patient _self relationships
    check:
      - user: user:ash
        object: patient:ash
        assertions:
          _self: true
          doctor: false
          guardian: false
      - user: user:dawn
        object: patient:dawn
        assertions:
          _self: true
          guardian: false

  - name: nurse derived from hospital
    check:
      - user: user:nurse_joy
        object: patient:ash
        assertions:
          nurse: true
      - user: user:nurse_nancy
        object: patient:dawn
        assertions:
          nurse: true
      # Nurse from a different hospital is not a nurse for this patient
      - user: user:nurse_joy
        object: patient:dawn
        assertions:
          nurse: false
      - user: user:nurse_nancy
        object: patient:ash
        assertions:
          nurse: false

  - name: record can_view - patient can view their own record
    check:
      - user: user:ash
        object: record:ash_blood_results
        assertions:
          can_view: true
          can_edit: true
      - user: user:dawn
        object: record:dawn_vaccinations
        assertions:
          can_view: true
          can_edit: true

  - name: record can_view - doctor can view and edit
    check:
      - user: user:gary
        object: record:ash_blood_results
        assertions:
          can_view: true
          can_edit: true
      - user: user:barry
        object: record:dawn_vaccinations
        assertions:
          can_view: true
          can_edit: true

  - name: record can_view - guardian can view but not edit
    check:
      - user: user:cynthia
        object: record:dawn_vaccinations
        assertions:
          can_view: true
          can_edit: false

  - name: record can_view - nurse at owner's hospital can view but not edit
    check:
      - user: user:nurse_joy
        object: record:ash_blood_results
        assertions:
          can_view: true
          can_edit: false
      - user: user:nurse_nancy
        object: record:dawn_vaccinations
        assertions:
          can_view: true
          can_edit: false

  - name: record access denied - nurse from a different hospital
    check:
      - user: user:nurse_nancy
        object: record:ash_blood_results
        assertions:
          can_view: false
          can_edit: false
      - user: user:nurse_joy
        object: record:dawn_vaccinations
        assertions:
          can_view: false
          can_edit: false

  - name: record access denied - unrelated user
    check:
      - user: user:team_rocket
        object: record:ash_blood_results
        assertions:
          can_view: false
          can_edit: false

  - name: record access denied - other patients
    check:
      - user: user:ash
        object: record:dawn_vaccinations
        assertions:
          can_view: false
          can_edit: false
      - user: user:dawn
        object: record:ash_blood_results
        assertions:
          can_view: false
          can_edit: false
