info:
  title: OpenHealth API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/accounts:
    get:
      description: Lists accounts up to the provided limit
      operationId: list-accounts
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts - [GET]
      tags:
        - accounts
    post:
      description: Creates a new account
      operationId: create-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts - [POST]
      tags:
        - accounts
  /api/v1/accounts/{accountID}:
    delete:
      description: Archives an existing account
      operationId: archive-account
      parameters:
        - in: path
          name: accountID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{accountID} - [DELETE]
      tags:
        - accounts
    get:
      description: Gets an account by its ID
      operationId: get-account
      parameters:
        - in: path
          name: accountID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountByIDResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{accountID} - [GET]
      tags:
        - accounts
    put:
      description: Updates an existing account
      operationId: update-account
      parameters:
        - in: path
          name: accountID
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountInputBody"
        required: true
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{accountID} - [PUT]
      tags:
        - accounts
  /api/v1/accounts/{accountID}/medical-records:
    get:
      description: Lists medical records for an account
      operationId: list-medical-records-by-account
      parameters:
        - in: path
          name: accountID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMedicalRecordsByAccountIDResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{accountID}/medical-records - [GET]
      tags:
        - medical-records
  /api/v1/doctors:
    post:
      description: Creates a new doctor
      operationId: create-doctor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDoctorResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/doctors - [POST]
      tags:
        - doctors
  /api/v1/doctors/assignments:
    post:
      description: Assigns a doctor to an account
      operationId: create-doctor-to-account-assignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorToAccountAssignmentInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDoctorToAccountAssignmentResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/doctors/assignments - [POST]
      tags:
        - doctors
  /api/v1/doctors/{doctorID}:
    get:
      description: Gets a doctor by its ID
      operationId: get-doctor
      parameters:
        - in: path
          name: doctorID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDoctorByIDResponseBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: /api/v1/doctors/{doctorID} - [GET]
      tags:
        - doctors
  /api/v1/healthcheck:
    get:
      description: Checks if the service is healthy
      operationId: healthcheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/healthcheck - [GET]
      tags:
        - system
  /api/v1/hospitals:
    post:
      description: Creates a new hospital
      operationId: create-hospital
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHospitalInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHospitalResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/hospitals - [POST]
      tags:
        - hospitals
  /api/v1/hospitals/assignments:
    post:
      description: Assigns a hospital to an account
      operationId: create-hospital-to-account-assignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHospitalToAccountAssignmentInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHospitalToAccountAssignmentResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/hospitals/assignments - [POST]
      tags:
        - hospitals
  /api/v1/hospitals/{hospitalID}:
    get:
      description: Gets a hospital by its ID
      operationId: get-hospital
      parameters:
        - in: path
          name: hospitalID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHospitalByIDResponseBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: /api/v1/hospitals/{hospitalID} - [GET]
      tags:
        - hospitals
  /api/v1/medical-records:
    post:
      description: Creates a new medical record
      operationId: create-medical-record
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicalRecordInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMedicalRecordResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/medical-records - [POST]
      tags:
        - medical-records
  /api/v1/medical-records/{medicalRecordID}:
    get:
      description: Gets a medical record by its ID
      operationId: get-medical-record
      parameters:
        - in: path
          name: medicalRecordID
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMedicalRecordByIDResponseBody"
          description: OK
        "404":
