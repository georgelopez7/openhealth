components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        age:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        id:
          type: string
        last_name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - first_name
        - last_name
        - age
        - email
        - created_at
        - updated_at
      type: object
    CreateAccountInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/CreateAccountInputBody.json
          format: uri
          readOnly: true
          type: string
        age:
          format: int64
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
        - first_name
        - last_name
        - age
        - email
      type: object
    CreateAccountResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/CreateAccountResponseBody.json
          format: uri
          readOnly: true
          type: string
        account:
          $ref: "#/components/schemas/Account"
      required:
        - account
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetAccountByIDResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/GetAccountByIDResponseBody.json
          format: uri
          readOnly: true
          type: string
        account:
          $ref: "#/components/schemas/Account"
      required:
        - account
      type: object
    HealthcheckBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/HealthcheckBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Service health status
          type: string
      required:
        - status
      type: object
    ListAccountsResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/ListAccountsResponseBody.json
          format: uri
          readOnly: true
          type: string
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
      required:
        - accounts
      type: object
    UpdateAccountInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:/schemas/UpdateAccountInputBody.json
          format: uri
          readOnly: true
          type: string
        age:
          format: int64
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
        - first_name
        - last_name
        - age
        - email
      type: object
info:
  title: OpenHealth API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/accounts:
    get:
      description: Lists accounts up to the provided limit
      operationId: list-accounts
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts - [GET]
      tags:
        - accounts
    post:
      description: Creates a new account
      operationId: create-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts - [POST]
      tags:
        - accounts
  /api/v1/accounts/{id}:
    get:
      description: Gets an account by its ID
      operationId: get-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountByIDResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{id} - [GET]
      tags:
        - accounts
    put:
      description: Updates an existing account
      operationId: update-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountInputBody"
        required: true
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/accounts/{id} - [PUT]
      tags:
        - accounts
  /api/v1/healthcheck:
    get:
      description: Checks if the service is healthy
      operationId: healthcheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: /api/v1/healthcheck - [GET]
      tags:
        - system
servers:
  - url: "http://localhost:"

