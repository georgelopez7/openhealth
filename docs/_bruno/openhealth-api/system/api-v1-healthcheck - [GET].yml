info:
  name: /api/v1/healthcheck - [GET]
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/healthcheck"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{BASE_URL}}/api/v1/healthcheck"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "status": ""
          }
  - name: default Response
    description: Error
    request:
      url: "{{BASE_URL}}/api/v1/healthcheck"
      method: GET
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

