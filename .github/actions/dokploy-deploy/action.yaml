name: Dokploy Compose Deploy
description: Triggers a full Docker Compose deployment in Dokploy

inputs:
  dokploy-domain:
    description: Dokploy instance domain (e.g. https://admin.example.com)
    required: true
  api-key:
    description: Dokploy API key
    required: true
  compose-id:
    description: Dokploy composeId to deploy
    required: true
  title:
    description: Deployment title (shown in Dokploy deployments)
    required: false
    default: GitHub Actions Deployment
  description:
    description: Deployment description (shown in Dokploy deployments)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Trigger Dokploy Compose Deployment
      shell: bash
      run: |
        echo "Triggering full Dokploy Compose deployment for ${{ inputs.compose-id }}..."
        curl -f -X 'POST' \
          '${{ inputs.dokploy-domain }}/api/compose.deploy' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -H 'x-api-key: ${{ inputs.api-key }}' \
          -d '{
            "composeId": "${{ inputs.compose-id }}",
            "title": "${{ inputs.title }}",
            "description": "${{ inputs.description }}"
          }'
