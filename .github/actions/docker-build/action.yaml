name: Docker Build
description: Builds and optionally pushes a Docker image

inputs:
  context:
    description: Build context path
    required: true
  file:
    description: Path to Dockerfile
    required: true
  image:
    description: Image name without registry prefix (e.g. openhealth-app)
    required: true
  tags:
    description: Docker metadata-action tags block
    required: true
  push:
    description: Push image to registry
    default: "false"
  build-args:
    description: Optional Docker build arguments
    default: ""
  dockerhub-username:
    description: DockerHub username
    required: true
  dockerhub-token:
    description: DockerHub access token
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.dockerhub-username }}/${{ inputs.image }}
        tags: ${{ inputs.tags }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build-args }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
