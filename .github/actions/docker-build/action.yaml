name: Docker Build
description: Builds and optionally pushes a Docker image

inputs:
  context:
    description: Build context path
    required: true
  file:
    description: Path to Dockerfile
    required: true
  image:
    description: Image name without registry prefix (e.g. openhealth-app)
    required: true
  registry:
    description: Registry hostname without a scheme
    required: true
  tags:
    description: Docker metadata-action tags block
    required: true
  push:
    description: Push image to registry
    default: "false"
  build-args:
    description: Optional Docker build arguments
    default: ""
  username:
    description: Registry username used when pushing
    required: false
  password:
    description: Registry password or token used when pushing
    required: false

runs:
  using: composite
  steps:
    - name: Validate registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        if [[ -z "$REGISTRY" ]]; then
          echo "::error::Set the ZOT_DOMAIN repository variable to the Zot registry hostname."
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry }}/${{ inputs.image }}
        tags: ${{ inputs.tags }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        build-args: ${{ inputs.build-args }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
