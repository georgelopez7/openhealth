name: OpenFGA - Model Testing
description: Installs the FGA CLI and runs OpenFGA model tests

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.3"
        cache: true

    - name: Install FGA CLI
      shell: bash
      run: go install github.com/openfga/cli/cmd/fga@latest

    - name: Run OpenFGA tests
      shell: bash
      run: make test-openfga
